name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: pytest app/test_main.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:${{ github.sha }} .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:${{ github.sha }}

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBERNETES_KUBECONFIG }}" > ~/.kube/config

    - name: Deploy to Kubernetes
      run: |
        sed -i "s/DOCKERHUB_USERNAME/${{ secrets.DOCKERHUB_USERNAME }}/g" Deployment/deployment.yaml
        sed -i "s/IMAGE_TAG/${{ github.sha }}/g" Deployment/deployment.yaml
        kubectl apply -f Deployment/deployment.yaml
        kubectl apply -f Deployment/service.yaml
